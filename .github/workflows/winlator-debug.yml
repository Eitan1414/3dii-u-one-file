name: Build Winlator diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'builder/winlator_debug.py'
      - '.github/workflows/winlator-debug.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Download pinned upstream Builder release
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 "https://github.com/J-Glitch2502/3dii-u/releases/download/v1.0.2/3Dii-U-Builder-1.0.2-2026-11-15.11.zip" --output payload.zip
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
          $expected = '99a877272f1977fff91e7d1f1a236c55c37cfe4fd2d08b68de4340dcf95b8e0b'
          $actual = (Get-FileHash payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Upstream ZIP SHA256 mismatch" }
          python builder/winlator_launcher.py --check-archive payload.zip

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --onefile --console --debug bootloader --noupx --noconfirm --name "3Dii-U-Winlator-Debug" --add-data "payload.zip;." builder/winlator_debug.py

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: 3Dii-U-Winlator-Debug-x64
          path: dist/3Dii-U-Winlator-Debug.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
